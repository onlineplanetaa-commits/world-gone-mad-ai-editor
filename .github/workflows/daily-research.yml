name: Daily research shortlist

on:
  push:
    branches: [main]
    paths:
      - "daily_research.py"
      - ".github/workflows/daily-research.yml"
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-shortlist
  cancel-in-progress: false

jobs:
  build-shortlist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RSS parser
        run: python -m pip install --upgrade feedparser

      - name: Build the daily shortlist
        run: python daily_research.py

      - name: Commit the shortlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-shortlist/
          if git diff --cached --quiet; then
            echo "No shortlist changes to commit."
          else
            git commit -m "Add daily research shortlist"
            git pull --rebase -X theirs origin main
            git push
          fi
